# Continuous replication of the SQLite database to object storage. See DEPLOY.md.
#
# Written for Litestream 0.5.x: `replica:` is singular and snapshot settings are
# global. The 0.3.x format in most tutorials (`replicas:` list with per-replica
# `snapshot-interval`) will not load.

# Litestream expands $VAR and ${VAR} itself.
access-key-id: ${NJT_R2_ACCESS_KEY_ID}
secret-access-key: ${NJT_R2_SECRET_ACCESS_KEY}

snapshot:
  # Restores replay WAL forward from the most recent snapshot, so the interval
  # bounds how much log a recovery has to chew through.
  interval: 24h
  retention: 168h

dbs:
  - path: ${NJT_DB_PATH}
    replica:
      type: s3
      bucket: ${NJT_R2_BUCKET}
      path: njt
      # R2 requires the literal region "auto".
      endpoint: ${NJT_R2_ENDPOINT}
      region: auto
